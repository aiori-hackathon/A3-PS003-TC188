# AIORI Traffic Intelligence API on an Oracle Cloud Always Free VM: the API container (code only; private artifacts are
# downloaded at start-up with a read-only Hugging Face token) behind Caddy, which serves HTTPS with an automatic certificate.
services:
  api:
    build: ../hf-space
    env_file: .env
    restart: unless-stopped
    expose:
      - "7860"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
volumes:
  caddy_data:
